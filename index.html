<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OPIc MASTER · SOM 오픽 마스터</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F5F0">
<style>
:root{
  --ivory:#F7F5F0; --ink:#14130F; --yolk:#FFC400; --card:#FFFEFB;
  --line:#E6E1D5; --dim:#8C8677; --soft:#EFEBE0; --deep:#232019;
  --good:#1C7A4D; --goodbg:#E8F4ED; --bad:#B93F2B; --badbg:#FAEAE6;
  --shadow:0 1px 0 rgba(20,19,15,.04), 0 12px 30px -26px rgba(20,19,15,.85);
  --sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--ivory);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-appearance:none}
b,strong{font-weight:800}
em{font-style:normal}
.en{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}

#app{
  display:flex;flex-direction:column;height:100vh;height:100dvh;
  max-width:480px;margin:0 auto;position:relative;background:var(--ivory);
  box-shadow:0 0 0 1px rgba(20,19,15,.04);
}

/* ---------------------------------------------------------- header */
#hdr{
  flex:none;padding:calc(10px + var(--sat)) 16px 10px;
  background:linear-gradient(180deg,#FBF9F3 0%,var(--ivory) 100%);
  border-bottom:1px solid var(--line);z-index:20;
}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.eggmark{
  width:22px;height:26px;flex:none;background:var(--yolk);
  border:2px solid var(--ink);border-radius:50% 50% 46% 46%/58% 58% 42% 42%;
  position:relative;
}
.eggmark:after{content:"";position:absolute;left:5px;top:7px;width:4px;height:5px;border-radius:50%;background:var(--ink);box-shadow:8px 0 0 var(--ink)}
.brand b{font-size:14px;letter-spacing:.14em;font-weight:900}
.brand small{color:var(--dim);font-size:10.5px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  width:44px;height:44px;border-radius:13px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;font-size:15px;flex:none;transition:transform .12s;
}
.iconbtn:active{transform:scale(.92)}
.iconbtn.off{opacity:.42}

.gradebar{display:flex;align-items:center;gap:10px;margin-top:10px}
.chip{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  height:27px;padding:0 10px;border-radius:9px;background:var(--ink);color:#FFFDF6;
  font-size:12px;font-weight:900;letter-spacing:.06em;flex:none;
}
.chip.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:800;letter-spacing:0}
.chip.fire{background:var(--yolk);color:var(--ink);border:1px solid var(--ink)}
.xpwrap{flex:1;min-width:0}
.xpbar{height:7px;border-radius:99px;background:var(--soft);overflow:hidden}
.xpbar i{display:block;height:100%;width:0%;border-radius:99px;background:var(--yolk);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.xptxt{display:flex;justify-content:space-between;gap:6px;margin-top:4px;font-size:10.5px;color:var(--dim);letter-spacing:-.01em}
.xptxt b{color:var(--ink);font-weight:800}

/* ---------------------------------------------------------- main */
#main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 16px 20px}
.screen{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.hero{
  position:relative;background:var(--ink);color:#FFFDF6;border-radius:22px;padding:20px 18px 18px;
  overflow:hidden;margin-bottom:14px;
}
.hero .kicker{font-size:10.5px;letter-spacing:.18em;color:var(--yolk);font-weight:800;margin-bottom:8px}
.hero h1{font-size:23px;line-height:1.28;margin:0 0 8px;letter-spacing:-.035em;font-weight:800}
.hero p{margin:0;font-size:12.5px;line-height:1.62;color:#C9C4B6}
.hero .yolkdot{position:absolute;right:-46px;top:-52px;width:156px;height:156px;border-radius:50%;border:26px solid rgba(255,196,0,.15)}
.hero .yolkdot:after{display:none}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.sectitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 2px 9px}
.sectitle h2{font-size:12px;letter-spacing:.13em;margin:0;font-weight:900;color:var(--ink)}
.sectitle span{font-size:11px;color:var(--dim)}

.btn{
  display:flex;align-items:center;justify-content:center;gap:7px;width:100%;min-height:54px;
  border-radius:16px;background:var(--ink);color:#FFFDF7;font-size:15.5px;font-weight:800;letter-spacing:-.01em;
  transition:transform .1s ease, opacity .15s;padding:0 16px;
}
.btn:active{transform:scale(.975)}
.btn.accent{background:var(--yolk);color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:active{background:var(--soft)}
.btn.line{background:transparent;border:1.5px solid var(--ink);color:var(--ink);box-shadow:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{min-height:46px;font-size:14px;border-radius:14px}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}

.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:8px;background:var(--soft);color:var(--ink);font-size:11px;font-weight:800;letter-spacing:-.01em}
.pill.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
.pill.yolk{background:var(--yolk)}

/* ---------------------------------------------------------- tabs */
#tabs{
  flex:none;display:flex;gap:4px;padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px));
  background:rgba(251,249,243,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:30;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:54px;border-radius:15px;color:var(--dim);transition:background .16s,color .16s,transform .1s;
}
.tab span{font-size:19px;line-height:1;filter:grayscale(1);opacity:.62;transition:.16s}
.tab em{font-size:10.5px;font-weight:800;letter-spacing:-.02em}
.tab:active{transform:scale(.96)}
.tab.on{background:var(--ink);color:#FFFDF7}
.tab.on span{filter:none;opacity:1;transform:translateY(-1px)}

/* ---------------------------------------------------------- quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.tbar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-bottom:14px}
.tbar i{display:block;height:100%;background:var(--yolk);border-radius:99px;width:100%}
.tbar i.warn{background:var(--bad)}

.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 16px 18px;box-shadow:var(--shadow);margin-bottom:14px;position:relative}
.tagline{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:900;letter-spacing:.08em;color:var(--dim);margin-bottom:9px}
.tagline:before{content:"";width:14px;height:2px;background:var(--yolk);border-radius:2px}
.qtext{font-size:17px;line-height:1.5;font-weight:800;letter-spacing:-.03em;margin:0;word-break:keep-all}
.qen{font-size:16.5px;line-height:1.5;font-weight:600;letter-spacing:-.01em}

.choices{display:flex;flex-direction:column;gap:9px}
.choice{
  display:flex;align-items:center;gap:11px;width:100%;min-height:60px;padding:12px 14px;
  background:var(--card);border:1.5px solid var(--line);border-radius:16px;text-align:left;
  font-size:14px;line-height:1.45;font-weight:600;letter-spacing:-.015em;color:var(--ink);
  transition:transform .1s,border-color .15s,background .15s;box-shadow:0 1px 0 rgba(20,19,15,.02);
}
.choice i{
  flex:none;width:24px;height:24px;border-radius:8px;background:var(--soft);color:var(--dim);
  display:grid;place-items:center;font-size:11.5px;font-weight:900;font-style:normal;
}
.choice:active{transform:scale(.985);background:#FCFAF4}
.choice.ok{border-color:var(--good);background:var(--goodbg);color:var(--good)}
.choice.ok i{background:var(--good);color:#fff}
.choice.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.choice.bad i{background:var(--bad);color:#fff}
.choice.dim{opacity:.5}
.choice.shake{animation:shake .34s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.xpfly{
  position:absolute;right:16px;top:8px;font-size:13px;font-weight:900;color:var(--good);
  animation:fly .9s ease-out forwards;pointer-events:none;
}
@keyframes fly{0%{opacity:0;transform:translateY(8px)}25%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}

/* ---------------------------------------------------------- story */
.topiclist{display:flex;flex-direction:column;gap:9px}
.topic{
  display:flex;align-items:center;gap:11px;width:100%;padding:13px 14px;min-height:62px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left;transition:transform .1s;
}
.topic:active{transform:scale(.985)}
.topic .emo{flex:none;width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:18px}
.topic .tx{flex:1;min-width:0}
.topic .tx b{display:block;font-size:14px;font-weight:800;letter-spacing:-.025em;margin-bottom:2px}
.topic .tx small{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic .st{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:11px;color:var(--dim)}
.topic.done .st{background:var(--ink);border:1.5px solid var(--ink);color:var(--yolk)}
.topic.done{background:#FBFAF5}

.slots{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.slot{
  display:flex;align-items:flex-start;gap:9px;min-height:38px;padding:8px 11px;border-radius:12px;
  border:1.5px dashed var(--line);background:#FCFAF5;font-size:11.5px;line-height:1.45;color:var(--dim);
}
.slot.filled{border:1.5px solid var(--ink);background:var(--card);color:var(--ink);animation:pop .26s ease-out}
.slot .nm{flex:none;font-weight:900;font-size:10px;letter-spacing:.02em;color:var(--dim);padding-top:2px;width:48px;white-space:nowrap}
.slot.filled .nm{color:var(--ink)}
.slot .en2{font-size:11.5px;line-height:1.5}
@keyframes pop{0%{transform:scale(.96);opacity:.6}100%{transform:scale(1);opacity:1}}

.pool{display:flex;flex-direction:column;gap:9px}
.scard{
  width:100%;text-align:left;padding:13px 14px;border-radius:16px;background:var(--card);
  border:1.5px solid var(--line);box-shadow:var(--shadow);transition:transform .1s,border-color .15s;
}
.scard:active{transform:scale(.985)}
.scard .en{display:block;font-size:12.5px;line-height:1.55;margin-bottom:5px}
.scard .ko{display:block;font-size:11px;line-height:1.5;color:var(--dim);word-break:keep-all}
.scard.shake{animation:shake .34s;border-color:var(--bad)}
.scard.used{opacity:0;pointer-events:none;transform:scale(.94);height:0;padding:0;margin:0;border:0;overflow:hidden;transition:all .2s}

/* ---------------------------------------------------------- mock */
.ava{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 14px}
.avafig{width:96px;height:104px;filter:drop-shadow(0 10px 18px rgba(20,19,15,.14))}
.ava .nm2{font-size:10.5px;letter-spacing:.16em;color:var(--dim);font-weight:900}
.mouth{transform-origin:60px 80px}
.talking .mouth{animation:talk .28s infinite}
@keyframes talk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(3.2)}}
.blink{animation:blink 4.6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%,98%{transform:scaleY(.1)}}

.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}

.tbox{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.ringwrap{position:relative;width:76px;height:76px;flex:none}
.ring{width:76px;height:76px;transform:rotate(-90deg)}
.ring .rbg{fill:none;stroke:var(--soft);stroke-width:7}
.ring .rfg{fill:none;stroke:var(--yolk);stroke-width:7;stroke-linecap:round;stroke-dasharray:276.5;stroke-dashoffset:0;transition:stroke-dashoffset .2s linear,stroke .3s}
.ring .rfg.low{stroke:var(--bad)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.ringtxt b{font-size:21px;font-weight:900;letter-spacing:-.04em;line-height:1}
.ringtxt small{font-size:9px;letter-spacing:.12em;color:var(--dim);font-weight:800}
.tbox .side{flex:1;min-width:0}
.tbox .side p{margin:0 0 8px;font-size:11.5px;line-height:1.45;color:var(--dim)}
.tbox .side .btnrow{gap:7px}

.model{background:#FBFAF5;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;animation:fade .2s}
.model h4{margin:0 0 8px;font-size:11px;letter-spacing:.1em;color:var(--dim);font-weight:900}
.model .en{font-size:13px;line-height:1.72;margin:0 0 10px;letter-spacing:-.005em}
.model .ko{font-size:11.5px;line-height:1.62;color:var(--dim);margin:0 0 12px;word-break:keep-all}
.pt{display:flex;gap:8px;font-size:11.5px;line-height:1.55;margin-bottom:7px;word-break:keep-all}
.pt > b{flex:none;width:17px;height:17px;border-radius:6px;background:var(--yolk);display:grid;place-items:center;font-size:9.5px;font-weight:900;margin-top:1px}
/* ---------------------------------------------------------- sheet / overlays */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;background:rgba(20,19,15,.45);animation:fade .18s}
.sheet.hidden{display:none}
.sheetin{
  width:100%;max-width:480px;margin:0 auto;background:var(--ivory);
  border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  animation:up .26s cubic-bezier(.2,.8,.2,1);max-height:86vh;overflow-y:auto;
}
@keyframes up{from{transform:translateY(28px)}to{transform:none}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:12px;letter-spacing:.1em;color:var(--dim);font-weight:900}
.sheet .ans{font-size:15px;line-height:1.5;font-weight:800;letter-spacing:-.02em;margin:0 0 10px;word-break:keep-all}
.sheet .ex{font-size:12.5px;line-height:1.65;color:#4A463D;margin:0 0 16px;word-break:keep-all}
.sheet .en-s{font-family:"Iowan Old Style",Georgia,serif;font-size:13px}

.levelup{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(20,19,15,.6);padding:24px}
.levelup.hidden{display:none}
.lvcard{
  width:100%;max-width:330px;background:var(--yolk);border:2px solid var(--ink);border-radius:26px;
  padding:26px 22px;text-align:center;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);animation:pop2 .4s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop2{0%{transform:scale(.82);opacity:0}100%{transform:scale(1);opacity:1}}
.lvcard .k{font-size:10.5px;letter-spacing:.2em;font-weight:900;margin-bottom:6px}
.lvcard .g{font-size:62px;font-weight:900;letter-spacing:-.05em;line-height:1;margin:6px 0 4px;font-family:"Iowan Old Style",Georgia,serif}
.lvcard .d{font-size:12px;line-height:1.5;margin:0 0 18px;word-break:keep-all;color:#3A352A}

#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(10px);bottom:calc(80px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:#FFFDF7;font-size:12.5px;font-weight:700;letter-spacing:-.01em;
  padding:11px 15px;border-radius:13px;max-width:88%;text-align:center;line-height:1.45;word-break:keep-all;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:65;box-shadow:0 10px 30px -12px rgba(0,0,0,.5);
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* helpers */
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb0{margin-bottom:0}
.center{text-align:center}
.hidden{display:none!important}
.small{font-size:11.5px;color:var(--dim);line-height:1.55}
.strike{text-decoration:line-through;opacity:.5}
.divider{height:1px;background:var(--line);margin:14px 0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{
  padding:9px 12px;border-radius:11px;background:var(--card);border:1.5px solid var(--line);
  font-size:12px;font-weight:800;letter-spacing:-.02em;min-height:44px;
}
.backbtn{
  display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 13px;
  border-radius:13px;border:1px solid var(--line);background:transparent;color:var(--dim);
  font-size:12px;font-weight:800;letter-spacing:-.02em;
}
.backbtn:active{background:var(--soft)}
.chips button:active{background:var(--soft)}
.chips button.on{background:var(--ink);color:#FFFDF7;border-color:var(--ink)}
.stat{display:flex;gap:8px}
.stat > div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:900;letter-spacing:-.04em;line-height:1.1}
.stat small{font-size:9.5px;letter-spacing:.09em;color:var(--dim);font-weight:800}
.result{text-align:center;padding:8px 4px 4px}
.result .big{font-size:30px;font-weight:900;letter-spacing:-.05em;margin:2px 0}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="hrow">
      <div class="brand">
        <span class="eggmark"></span>
        <b>OPIc MASTER</b>
        <small>· for SOM</small>
      </div>
      <button id="muteBtn" class="iconbtn" aria-label="소리">🔊</button>
    </div>
    <div class="gradebar">
      <span class="chip" id="gradeChip">IL</span>
      <div class="xpwrap">
        <div class="xpbar"><i id="xpFill"></i></div>
        <div class="xptxt"><span id="xpTxt"><b>0</b> XP</span><span id="nextTxt">IM1까지 120</span></div>
      </div>
      <span class="chip ghost" id="comboChip">🔥 0</span>
    </div>
  </header>

  <main id="main"></main>

  <nav id="tabs">
    <button class="tab on" data-tab="quiz"><span>⚡</span><em>스피드 퀴즈</em></button>
    <button class="tab" data-tab="story"><span>🧩</span><em>스토리 조립</em></button>
    <button class="tab" data-tab="mock"><span>🎙️</span><em>모의고사</em></button>
  </nav>
</div>

<div id="sheet" class="sheet hidden"><div class="sheetin" id="sheetin"></div></div>
<div id="levelup" class="levelup hidden"><div class="lvcard" id="lvcard"></div></div>
<div id="toast"></div>
<script>
/* =====================================================================
   OPIc MASTER · SOM 맞춤 모바일 학습 게임
   데이터 출처: work/opic/ 오픽 IH 완성북 (CH3 뼈대·필러, CH4 3콤보,
   CH5 돌발·롤플레이·어드밴스). 외부 라이브러리 없음.
   ===================================================================== */

/* ---------------------------------------------------------- 스피드 퀴즈 36문항 */
const QUIZ = [
  {tag:"필러 · 시간 벌기", q:"질문을 듣고 3초가 비었다. 가장 먼저 쓸 문장은?",
   c:["That's a good question. Let me think for a second.",
      "So, you're asking about the café I usually go to, right?",
      "Anyway, what I'm trying to say is…",
      "So, yeah, that's pretty much it."], a:0,
   ex:"가장 무난한 시작입니다. 나머지 셋은 각각 되묻기·복귀·마무리 신호라서 아직 쓸 자리가 아닙니다. 침묵 3초는 실력처럼 들리지 않습니다."},

  {tag:"필러 · 되묻기", q:"질문을 내 말로 바꿔 시작하는 문장은?",

  "en": "These days, most people plan a trip entirely on their phones. They book the flight, find the hotel, and read reviews, all in about twenty minutes. But maybe ten years ago, people used to go to a travel agency, talk to a person, and get a printed itinerary. I think it's mainly because information became free and fast. Honestly, I think both have good sides. Booking alone is cheaper and more flexible, but I do miss asking someone who actually knew the place. Last time I traveled, I booked everything myself, and it worked out well — but I still called the hotel three times to check things.",

  "q": "Some people share every trip on social media. What do you think about that?",
  "alt": "양가 → 이유 2 → 내 경험 → 조건부 결론.",
  "en": "To be honest, I have mixed feelings about sharing trips on social media. On one hand, it's a nice way to keep memories and to show people places they might never visit. I run a photo account myself, and I enjoy editing and posting my pictures. On the other hand, I think it can change the trip itself — sometimes people spend more time looking for the perfect shot than actually looking at the place. For example, on my last trip, I took about two hundred photos in one day, and later I realized I barely remembered the sunset. So now I try to put my phone away for the first ten minutes and just watch. I think sharing is fine, as long as the experience comes first.",
  "ko": "솔직히 SNS에 여행을 공유하는 것에 대해 양가적인 생각이 있습니다. 한편으로는 추억을 남기고, 누군가는 결코 가보지 못할 곳을 보여주는 좋은 방법입니다. 저도 사진 계정을 운영하고 사진을 편집해 올리는 걸 좋아합니다. 다른 한편으로는 여행 자체를 바꿔 놓을 수 있다고 생각합니다. 완벽한 사진을 찾느라 정작 그 장소를 보지 않는 경우가 있거든요. 예를 들어 지난여행에서 하루에 사진을 이백 장쯤 찍었는데, 나중에 보니 노을은 거의 기억나지 않았습니다. 그래서 지금은 처음 십 분은 휴대폰을 넣어두고 그냥 바라보려고 합니다. 경험이 먼저라면 공유하는 건 괜찮다고 생각합니다.",

  "q": "What do you think about AI being used in design work?",

  "en": "To be honest, I have mixed feelings about AI in design. On one hand, it's incredibly useful for the boring parts — I use it to find quick references and to clean up images, and it saves me hours. On the other hand, I worry that people will start to think the final image is the whole job, when most of the work is deciding what to make and why. For example, in my graduation project, the software did nothing until I decided what the piece should feel like. So I think AI is a tool, like a camera — it doesn't decide anything by itself. I'm fine with it, as long as designers stay responsible for the idea.",

  "ko": "네, 사실 — 지난여행에서 정확히 그런 일이 있었습니다. 둘째 날 밤 방에서 큰 바퀴벌레를 발견했고 다음 날 아침 또 한 마리를 봐서 프론트로 내려갔습니다. 처음에는 청소만 해주겠다고 해서, 여기서 잘 수 없다고 단호하게 말해야 했어요. 결국 다른 건물로 옮겨 주긴 했는데 추가 요금을 받아서 솔직히 짜증났습니다. 돌아보면 당황하지 않고 영어로 해결한 게 뿌듯하고, 지금은 리뷰를 훨씬 꼼꼼히 봅니다.",
  "pts": [
   "12번에서 연기한 사건을 '과거 경험'으로 다시 정리하는 것이 자연스럽습니다.",
   "문제 → 요청 → 거절 → 재요청 → 결과 → 감정 → 교훈, 일곱 단.",
   "마지막 두 문장(Looking back… / Next time…)이 답변을 성숙하게 만듭니다."
  ]
 }
];
</script>
<script>
/* =====================================================================
   게임 로직
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.prototype.slice.call(r.querySelectorAll(s));

const SAVE_KEY = 'opic_master_v1';
const GRADES = [
  {g:'IL',  min:0},
  {g:'IM1', min:120},
  {g:'IM2', min:320},
  {g:'IM3', min:600},
  {g:'IH',  min:950},
  {g:'AL',  min:1400}
];

const DEFAULTS = {xp:0, grade:'IL', bestCombo:0, quizBest:0, quizPlays:0, stages:{}, mockDone:0, mockBest:0, muted:false};
let S = Object.assign({}, DEFAULTS);
try { S = Object.assign(S, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
S.stages = S.stages || {};
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

function gradeIndex(xp){
  let gi = 0;
  for (let i = 0; i < GRADES.length; i++) if (xp >= GRADES[i].min) gi = i;
  return gi;
}

/* ---------------------------------------------------------- 사운드 */
let AC = null;
function audio(){
  if (AC) return AC;
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return null;
  try { AC = new C(); } catch (e) { AC = null; }
  return AC;
}
function tone(freq, at, dur, vol, type){
  const c = audio(); if (!c) return;
  const t = c.currentTime + at;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  o.connect(g); g.connect(c.destination);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.03);
}
const SFX = {
  ok(){ tone(880,0,.11,.09); tone(1318,.06,.16,.07); },
  bad(){ tone(190,0,.16,.09,'sawtooth'); tone(142,.08,.2,.07,'sawtooth'); },
  tap(){ tone(620,0,.05,.045,'sine'); },
  win(){ [784,988,1174].forEach((f,i)=>tone(f,i*.08,.26,.07,'triangle')); },
  level(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,i*.09,.34,.075,'triangle')); }
};
function sfx(name){
  if (S.muted) return;
  try { const c = audio(); if (!c) return; if (c.state === 'suspended' && c.resume) c.resume(); SFX[name](); } catch (e) {}
}

/* ---------------------------------------------------------- UI 잡동사니 */
let toastT = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('on'), 2300);
}
function openSheet(html){
  $('#sheetin').innerHTML = '<div class="grab"></div>' + html;
  $('#sheet').classList.remove('hidden');
}
function closeSheet(){ $('#sheet').classList.add('hidden'); }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const ordinal = ['①','②','③','④'];

/* ---------------------------------------------------------- 헤더 · XP */
function paintHeader(){
  const gi = gradeIndex(S.xp);
  const cur = GRADES[gi], next = GRADES[gi + 1];
  $('#gradeChip').textContent = cur.g;
  if (next){
    const pct = Math.max(0, Math.min(100, ((S.xp - cur.min) / (next.min - cur.min)) * 100));
    $('#xpFill').style.width = pct.toFixed(1) + '%';
    $('#nextTxt').textContent = next.g + '까지 ' + (next.min - S.xp) + ' XP';
  } else {
    $('#xpFill').style.width = '100%';
    $('#nextTxt').textContent = '최고 등급 · AL';
  }
  $('#xpTxt').innerHTML = '<b>' + S.xp + '</b> XP';
  $('#muteBtn').textContent = S.muted ? '🔇' : '🔊';
  $('#muteBtn').classList.toggle('off', !!S.muted);
  if (!quiz.on){
    const el = $('#comboChip');
    if (el){
      el.textContent = '🔥 ' + S.bestCombo;
      el.classList.remove('fire');
    }
  }
}
function setCombo(n){
  const el = $('#comboChip');
  if (!el) return;
  el.textContent = '🔥 ' + n;
  el.classList.toggle('fire', n >= 2);
}
function showLevelUp(g){
  $('#lvcard').innerHTML =
    '<div class="k">LEVEL UP</div>' +
    '<div class="g">' + g + '</div>' +
    '<p class="d">새 등급에 올랐어요. 이제 시험장에서 3초가 비어도<br>문장이 먼저 나옵니다.</p>' +
    '<button class="btn" id="lvClose">계속하기</button>';
  $('#levelup').classList.remove('hidden');
  // 축하 카드가 떠 있는 동안에는 퀴즈 타이머를 멈춘다 (시간을 빼앗기지 않도록)
  if (quiz.timer){ clearInterval(quiz.timer); quiz.timer = null; quiz.paused = true; }
  sfx('level');
  $('#lvClose').onclick = closeLevelUp;
}
function closeLevelUp(){
  $('#levelup').classList.add('hidden');
  if (quiz.paused){ quiz.paused = false; resumeQuizTimer(); }
}
function gainXP(n){
  const before = gradeIndex(S.xp);
  S.xp += n;
  const after = gradeIndex(S.xp);
  S.grade = GRADES[after].g;
  save();
  paintHeader();
  if (after > before) setTimeout(() => showLevelUp(GRADES[after].g), 420);
}

$('#muteBtn').addEventListener('click', () => {
  S.muted = !S.muted; save(); paintHeader();
  if (!S.muted) sfx('tap');
  toast(S.muted ? '소리를 껐어요' : '소리를 켰어요');
});
$('#levelup').addEventListener('click', e => { if (e.target.id === 'levelup') $('#levelup').classList.add('hidden'); });

/* =====================================================================
   MODE 01 · 스피드 퀴즈
   ===================================================================== */
const quiz = {on:false, list:[], i:0, combo:0, best:0, right:0, xp:0, timer:null, locked:false, left:10000, paused:false, wrong:[]};

const REVIEW_HINT = {
  '필러': '3-2 시간 벌기 표현 20',
  '시제': '3-3 시제 전환 연결어',
  '감정': '3-4 감정 디테일 사다리',
  '구동사': '4장 스크립트의 구동사',
  '롤플레이': '5-2 롤플레이 11~13번',
  '돌발': '5-1 돌발 주제 6',
  '어드밴스': '5-4 어드밴스 14~15번'
};

function stopQuizTimer(){ if (quiz.timer){ clearInterval(quiz.timer); quiz.timer = null; } quiz.paused = false; }

function buildRound(){
  return shuffle(QUIZ).slice(0, 10).map(q => {
    const opts = q.c.map((text, i) => ({ text:text, ok: i === q.a }));
    return { tag:q.tag, q:q.q, ex:q.ex, opts:shuffle(opts) };
  });
}

function renderQuizIntro(){
  stopQuizTimer(); quiz.on = false;
  $('#main').innerHTML =
    '<div class="screen">' +
      '<div class="hero">' +
        '<div class="yolkdot"></div>' +
        '<div class="kicker">MODE 01 · 10 QUESTIONS</div>' +
        '<h1>스피드 퀴즈로<br>뼈대 굳히기</h1>' +
        '<p>필러·시제·감정, 그리고 4~5장의 구동사와 롤플레이 대처 문장. 한 문항 10초, 콤보가 붙으면 XP도 붙습니다.</p>' +
      '</div>' +
      '<div class="stat">' +
        '<div><b>' + S.quizBest + '</b><small>최고 정답</small></div>' +
        '<div><b>' + S.bestCombo + '</b><small>최고 콤보</small></div>' +
        '<div><b>' + gradeIndex(S.xp) + '/5</b><small>등급 단계</small></div>' +
      '</div>' +
      '<button class="btn accent mt12" id="startQuiz">시작하기 · 10문항</button>' +
      '<div class="sectitle"><h2>출제 범위</h2><span>36문항 중 10</span></div>' +
      '<div class="card">' +
        '<div class="pt"><b>1</b><span>필러 20개 — 상황에 맞는 시간 벌기 문장 고르기</span></div>' +
        '<div class="pt"><b>2</b><span>시제 전환 — 과거·현재완료를 구분하는 문장</span></div>' +
        '<div class="pt"><b>3</b><span>구동사 — wrap up, block out, just in case</span></div>' +
        '<div class="pt mb0"><b>4</b><span>롤플레이 11~13번, 돌발·어드밴스 대처</span></div>' +
      '</div>' +
    '</div>';
  $('#startQuiz').onclick = () => startQuiz();
  paintHeader();
}

function startQuiz(){
  quiz.on = true; quiz.list = buildRound(); quiz.i = 0; quiz.combo = 0; quiz.best = 0; quiz.right = 0; quiz.xp = 0; quiz.wrong = [];
  setCombo(0);
  renderQuizQ();
}

function renderQuizQ(){
  stopQuizTimer();
  const q = quiz.list[quiz.i];
  quiz.locked = false;
  $('#main').scrollTop = 0;
  $('#main').innerHTML =
    '<div class="screen">' +
      '<div class="qtop">' +
        '<span class="pill">Q ' + (quiz.i + 1) + ' / ' + quiz.list.length + '</span>' +
        '<span class="pill ghost" id="comboPill">🔥 ' + quiz.combo + ' 콤보</span>' +
      '</div>' +
      '<div class="tbar"><i id="tfill"></i></div>' +
      '<div class="qcard" id="qcard">' +
        '<div class="tagline">' + q.tag + '</div>' +
        '<p class="qtext">' + q.q + '</p>' +
      '</div>' +
      '<div class="choices" id="choices">' +
        q.opts.map((o, i) =>
          '<button class="choice" data-i="' + i + '"><i>' + 'ABCD'[i] + '</i><span>' + o.text + '</span></button>'
        ).join('') +
      '</div>' +
      '<p class="small center" style="margin-top:16px">정답이면 바로 다음 문항 · 틀리면 즉시 해설</p>' +
    '</div>';

  const pill = $('#comboPill');
  if (quiz.combo >= 2){ pill.classList.remove('ghost'); pill.classList.add('yolk'); }

  $$('#choices .choice').forEach(btn => {
    btn.addEventListener('click', () => answerQuiz(btn, parseInt(btn.dataset.i, 10)));
  });
  // 레벨업 축하 카드가 떠 있는 동안에는 타이머를 시작하지 않는다
  if ($('#levelup').classList.contains('hidden')){
    startQuizTimer();
  } else {
    quiz.left = QUIZ_DUR;
    paintQuizTimer();
    quiz.paused = true;
  }
}

const QUIZ_DUR = 10000;
function paintQuizTimer(){
  const fill = $('#tfill');
  if (!fill) return;
  const p = Math.max(0, quiz.left) / QUIZ_DUR;
  fill.style.width = (p * 100) + '%';
  fill.classList.toggle('warn', quiz.left <= 3000);
}
function tickQuizTimer(){
  quiz.left -= 100;
  paintQuizTimer();
  if (quiz.left <= 0){ stopQuizTimer(); quizTimeout(); }
}
function startQuizTimer(){
  stopQuizTimer();
  quiz.left = QUIZ_DUR;
  paintQuizTimer();
  quiz.timer = setInterval(tickQuizTimer, 100);
}
function resumeQuizTimer(){
  if (quiz.timer || quiz.locked || !quiz.on) return;
  if (quiz.left <= 0) return;
  quiz.timer = setInterval(tickQuizTimer, 100);
}

function flyXP(text){
  const card = $('#qcard');
  if (!card) return;
  const s = document.createElement('span');
  s.className = 'xpfly';
  s.textContent = text;
  card.appendChild(s);
  setTimeout(() => s.remove(), 950);
}

function answerQuiz(btn, idx){
  if (quiz.locked) return;
  quiz.locked = true;
  stopQuizTimer();
  const q = quiz.list[quiz.i];
  const picked = q.opts[idx];

  $$('#choices .choice').forEach((b, i) => {
    if (q.opts[i].ok) b.classList.add('ok');
    else if (i === idx) b.classList.add('bad');
    else b.classList.add('dim');
  });

  if (picked.ok){
    quiz.combo++; quiz.right++;
    if (quiz.combo > quiz.best) quiz.best = quiz.combo;
    if (quiz.combo > S.bestCombo) S.bestCombo = quiz.combo;
    const pts = 12 + Math.min(quiz.combo - 1, 5) * 4;
    quiz.xp += pts;
    setCombo(quiz.combo);
    sfx('ok');
    flyXP('+' + pts + ' XP');
    gainXP(pts);
    setTimeout(nextQuiz, 760);
  } else {
    quiz.combo = 0;
    quiz.wrong.push(q.tag.split(' · ')[0]);
    setCombo(0);
    sfx('bad');
    explainQuiz(q, false);
  }
}

function quizTimeout(){
  if (quiz.locked) return;
  quiz.locked = true;
  const q = quiz.list[quiz.i];
  $$('#choices .choice').forEach((b, i) => {
    if (q.opts[i].ok) b.classList.add('ok');
    else b.classList.add('dim');
  });
  quiz.combo = 0;
  quiz.wrong.push(q.tag.split(' · ')[0]);
  setCombo(0);
  sfx('bad');
  explainQuiz(q, true);
}

function explainQuiz(q, timeout){
  const right = q.opts.filter(o => o.ok)[0].text;
  openSheet(
    '<h3>' + (timeout ? '⏱ 시간 초과' : '✕ 오답') + ' · ' + q.tag + '</h3>' +
    '<p class="ans en">' + right + '</p>' +
    '<p class="ex">' + q.ex + '</p>' +
    '<button class="btn" id="sheetNext">' + (quiz.i + 1 >= quiz.list.length ? '결과 보기' : '계속하기') + '</button>'
  );
  $('#sheetNext').onclick = () => { closeSheet(); nextQuiz(); };
}

function nextQuiz(){
  if (quiz.i + 1 >= quiz.list.length){ endQuiz(); return; }
  quiz.i++;
  renderQuizQ();
}

function endQuiz(){
  stopQuizTimer();
  quiz.on = false;
  S.quizPlays = (S.quizPlays || 0) + 1;
  if (quiz.right > S.quizBest) S.quizBest = quiz.right;
  save();
  const n = quiz.list.length, r = quiz.right;
  let line = '지금 페이스면 충분해요. 틀린 태그만 다시 보면 됩니다.';
  if (r >= 9) line = '완벽에 가까워요. 이 속도면 시험장에서 3초가 안 비어요.';
  else if (r >= 7) line = '좋아요. 오답 태그 두 개만 다시 읽으면 바로 올라갑니다.';
  else if (r <= 4) line = '괜찮아요. 3장 필러부터 다시 잡으면 됩니다.';
  const uniq = quiz.wrong.filter((v, i, a) => a.indexOf(v) === i);
  const reviewHtml = uniq.length
    ? '<div class="card mt12" style="text-align:left">' +
        '<p class="small" style="margin:0 0 9px">다시 볼 태그 · 교재 위치</p>' +
        uniq.map(g => '<div class="pt"><b>!</b><span><b style="color:#14130F">' + g + '</b> — ' + (REVIEW_HINT[g] || '') + '</span></div>').join('') +
      '</div>'
    : '<div class="card mt12" style="text-align:left"><p class="small mb0">오답이 없어요. 다음은 <b style="color:#14130F">스토리 조립</b>으로 4단 뼈대를 몸에 붙이면 됩니다.</p></div>';
  sfx('win');
  $('#main').scrollTop = 0;
  $('#main').innerHTML =
    '<div class="screen result">' +
      '<span class="pill yolk">ROUND CLEAR</span>' +
      '<div class="big">' + r + ' <span style="color:#B9B3A6">/ ' + n + '</span></div>' +
      '<p class="small">' + line + '</p>' +
      '<div class="stat mt12">' +
        '<div><b>' + quiz.best + '</b><small>이번 판 콤보</small></div>' +
        '<div><b>' + quiz.xp + '</b><small>획득 XP</small></div>' +
        '<div><b>' + S.bestCombo + '</b><small>역대 콤보</small></div>' +
      '</div>' +
      reviewHtml +
      '<button class="btn mt12" id="againQuiz">다시 도전</button>' +
      '<button class="btn ghost mt8" id="toStory">스토리 조립으로</button>' +
    '</div>';
  $('#againQuiz').onclick = () => startQuiz();
  $('#toStory').onclick = () => setTab('story');
  paintHeader();
}

/* =====================================================================
   MODE 02 · 4단 스토리 조립
   ===================================================================== */
const STAGES = ['서론', '본론', '감정', '결론'];
const story = {cur:null, need:0, pool:[], done:0};

function renderStoryList(){
  const doneCount = STORY.filter(s => S.stages[s.id]).length;
  $('#main').scrollTop = 0;
  $('#main').innerHTML =
    '<div class="screen">' +
      '<div class="hero">' +
        '<div class="yolkdot"></div>' +
        '<div class="kicker">MODE 02 · 9 STORIES</div>' +
        '<h1>서론 → 본론 → 감정 → 결론</h1>' +
        '<p>카드가 섞여 있습니다. 순서대로 탭하면 SOM 이야기가 한 편의 답변이 됩니다. 틀리면 그 자리에서 짚어 줍니다.</p>' +
      '</div>' +
      '<div class="sectitle"><h2>주제</h2><span>' + doneCount + ' / ' + STORY.length + ' 완성</span></div>' +
      '<div class="topiclist">' +
        STORY.map(s =>
          '<button class="topic' + (S.stages[s.id] ? ' done' : '') + '" data-id="' + s.id + '">' +
            '<span class="emo">' + s.emo + '</span>' +
            '<span class="tx"><b>' + s.title + '</b><small>' + s.sub + '</small></span>' +
            '<span class="st">' + (S.stages[s.id] ? '✓' : '→') + '</span>' +
          '</button>'
        ).join('') +
      '</div>' +
    '</div>';
  $$('.topic').forEach(b => b.addEventListener('click', () => openStory(b.dataset.id)));
  paintHeader();
}

function openStory(id){
  const t = STORY.filter(s => s.id === id)[0];
  if (!t) return;
  story.cur = t;
  story.need = 0;
  story.pool = shuffle(t.cards.map((c, i) => ({ i:i, s:c.s, en:c.en, ko:c.ko })));
  renderStoryPlay();
}

function renderStoryPlay(){
  const t = story.cur;
  $('#main').scrollTop = 0;
  $('#main').innerHTML =
    '<div class="screen">' +
      '<div class="qtop">' +
        '<button class="backbtn" id="backStory">‹ 목록</button>' +
        '<span class="pill ghost">' + t.emo + ' ' + t.title + '</span>' +
      '</div>' +
      '<p class="small" style="margin:2px 2px 10px">' + ordinal[Math.min(story.need,3)] + ' <b style="color:#14130F">' + STAGES[Math.min(story.need,3)] + '</b> 카드를 고르세요. 남은 카드 ' + (4 - story.need) + '장.</p>' +
      '<div class="slots" id="slots">' +
        STAGES.map((s, i) =>
          '<div class="slot' + (i < story.need ? ' filled' : '') + '" data-i="' + i + '">' +
            '<span class="nm">' + ordinal[i] + ' ' + s + '</span>' +
            '<span class="en2">' + (i < story.need ? placedCard(i).en : '') + '</span>' +
          '</div>'
        ).join('') +
      '</div>' +
      '<div class="pool" id="pool">' +
        story.pool.map(c =>
          '<button class="scard' + (c.i < story.need ? ' used' : '') + '" data-i="' + c.i + '">' +
            '<span class="en">' + c.en + '</span>' +
            '<span class="ko">' + c.ko + '</span>' +
          '</button>'
        ).join('') +
      '</div>' +
    '</div>';
  $('#backStory').onclick = () => renderStoryList();
  $$('#pool .scard').forEach(b => b.addEventListener('click', () => tapStory(b, parseInt(b.dataset.i, 10))));
  paintHeader();
}

function placedCard(i){ return story.cur.cards[i]; }

function tapStory(btn, i){
  if (i < story.need) return;
  if (i === story.need){
    sfx('ok');
    story.need++;
    const slots = $$('#slots .slot');
    const slot = slots[i];
    slot.classList.add('filled');
    slot.querySelector('.en2').textContent = placedCard(i).en;
    btn.classList.add('used');
    const head = $('#main .small');
    if (head && story.need < 4){
      head.innerHTML = ordinal[story.need] + ' <b style="color:#14130F">' + STAGES[story.need] + '</b> 카드를 고르세요. 남은 카드 ' + (4 - story.need) + '장.';
    }
    if (story.need === 4) setTimeout(finishStory, 420);
  } else {
    sfx('bad');
    btn.classList.remove('shake');
    void btn.offsetWidth;
    btn.classList.add('shake');
    toast('순서가 달라요 — 지금은 ' + ordinal[story.need] + '\u00A0' + STAGES[story.need] + ' 차례예요.');
  }
}

function finishStory(){
  const t = story.cur;
  const first = !S.stages[t.id];
  const pts = first ? 30 : 10;
  S.stages[t.id] = true;
  save();
  sfx('win');
  gainXP(pts);
  $('#main').scrollTop = 0;
  $('#main').innerHTML =
    '<div class="screen">' +
      '<div class="qtop"><span class="pill yolk">완성 ' + STAGES.length + '/4</span><span class="pill ghost">+' + pts + ' XP</span></div>' +
      '<div class="qcard">' +
        '<div class="tagline">' + t.emo + ' ' + t.title + '</div>' +
        '<p class="qtext" style="font-size:15px">네 문장이 하나의 답변이 됐어요. 소리 내어 한 번 읽어 보세요.</p>' +
      '</div>' +
      '<div class="card">' +
        t.cards.map((c, i) =>
          '<div class="pt"><b>' + ordinal[i][0] + '</b><span class="en" style="font-size:12.5px;line-height:1.6">' + c.en + '</span></div>'
        ).join('') +
        '<div class="divider"></div>' +
        '<p class="small mb0">이 구조를 시험장에서 그대로 씁니다. ' + t.cards[0].s + ' 여덟 초, 본론 스물두 초, 감정 열 초, 결론 다섯 초.</p>' +
      '</div>' +
      '<button class="btn" id="nextStory">다른 주제 조립하기</button>' +
    '</div>';
  $('#nextStory').onclick = () => renderStoryList();
  paintHeader();
}

/* =====================================================================
   MODE 03 · Ava 모의고사
   ===================================================================== */
const TOPIC_ORDER = ['intro','c4-1','c4-2','c4-3','c4-4','c4-5','c4-6','c4-7','dolbal','rp','adv'];
const TOPIC_LABEL = {
  intro:'자기소개', 'c4-1':'3D·작업', 'c4-2':'집·동네', 'c4-3':'영화·전시',
  'c4-4':'카페·음악', 'c4-5':'푸꾸옥', 'c4-6':'건강·운동', 'c4-7':'테크·SNS',
  dolbal:'돌발', rp:'롤플레이', adv:'어드밴스'
};
const mock = {list:[], i:0, left:60, timer:null, running:false, xp:0, open:false, label:''};

const AVA_SVG =
  '<svg class="avafig" viewBox="0 0 120 130" aria-label="Ava">' +
    '<ellipse cx="60" cy="70" rx="47" ry="53" fill="#FFC400"/>' +
    '<ellipse cx="60" cy="70" rx="47" ry="53" fill="none" stroke="#14130F" stroke-width="3"/>' +
    '<ellipse class="eye blink" cx="45" cy="60" rx="5" ry="7.5" fill="#14130F"/>' +
    '<ellipse class="eye blink" cx="75" cy="60" rx="5" ry="7.5" fill="#14130F"/>' +
    '<ellipse cx="36" cy="77" rx="7" ry="4.5" fill="#E8632F" opacity=".38"/>' +
    '<ellipse cx="84" cy="77" rx="7" ry="4.5" fill="#E8632F" opacity=".38"/>' +
    '<path class="mouth" d="M53 82 q7 7 14 0" stroke="#14130F" stroke-width="3.6" fill="none" stroke-linecap="round"/>' +
  '</svg>';

function stopMockTimer(){ if (mock.timer){ clearInterval(mock.timer); mock.timer = null; } mock.running = false; }
function stopSpeech(){ try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {} }
function stopAll(){ stopQuizTimer(); stopMockTimer(); stopSpeech(); }

function renderMockIntro(){
  stopMockTimer();
  const groups = TOPIC_ORDER.map(id => ({
    id: id,
    label: TOPIC_LABEL[id],
    n: MOCK.filter(m => m.topicId === id).length
  })).filter(g => g.n > 0);

  $('#main').scrollTop = 0;
  $('#main').innerHTML =
    '<div class="screen">' +
      '<div class="ava">' + AVA_SVG + '<span class="nm2">AVA · INTERVIEWER</span></div>' +
      '<div class="hero">' +
        '<div class="yolkdot"></div>' +
        '<div class="kicker">MODE 03 · SPEAKING TEST</div>' +
        '<h1>실전 아바타 모의고사</h1>' +
        '<p>Ava가 질문을 읽어 줍니다. 60초 타이머로 답하고, 막히면 모범답안과 핵심 포인트 3개를 열어 확인하세요.</p>' +
      '</div>' +
      '<div class="stat">' +
        '<div><b>' + (S.mockDone || 0) + '</b><small>완료 문항</small></div>' +
        '<div><b>' + MOCK.length + '</b><small>전체 문항</small></div>' +
        '<div><b>' + S.grade + '</b><small>현재 등급</small></div>' +
      '</div>' +
      '<button class="btn accent mt12" id="random15">랜덤 15문항 시작</button>' +
      '<div class="sectitle"><h2>주제별로 연습</h2><span>총 ' + MOCK.length + '문항</span></div>' +
      '<div class="chips" id="topicChips">' +
        groups.map(g => '<button data-id="' + g.id + '">' + g.label + ' · ' + g.n + '</button>').join('') +
      '</div>' +
    '</div>';

  $('#random15').onclick = () => {
    const intro = MOCK.filter(m => m.topicId === 'intro');
    const rest = shuffle(MOCK.filter(m => m.topicId !== 'intro')).slice(0, 14);
    startMock(intro.concat(rest), '랜덤 15문항');
  };
  $$('#topicChips button').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.id;
    const list = MOCK.filter(m => m.topicId === id);
    startMock(list, TOPIC_LABEL[id]);
  }));
  paintHeader();
}

function startMock(list, label){
  if (!list.length) return;
  mock.list = list; mock.i = 0; mock.xp = 0; mock.left = 60; mock.open = false; mock.label = label || '';
  renderMockQ();
}

function paintRing(){
  const c = 276.5;
  const p = Math.max(0, Math.min(60, mock.left)) / 60;
  const fg = $('#rfg');
  if (!fg) return;
  fg.style.strokeDashoffset = String(c * (1 - p));
  fg.classList.toggle('low', mock.left <= 10);
  const sec = $('#tsec');
  if (sec) sec.textContent = String(Math.ceil(mock.left));
}

function renderMockQ(){
  stopMockTimer();
  stopSpeech();
  mock.left = 60;
  mock.open = false;
  const m = mock.list[mock.i];
  $('#main').scrollTop = 0;
  $('#main').innerHTML =
    '<div class="screen">' +
      '<div class="qmeta">' +
        '<button class="backbtn" id="mockBack">‹ 주제</button>' +
        '<span class="pill">' + (mock.i + 1) + ' / ' + mock.list.length + '</span>' +
      '</div>' +
      '<div class="ava">' + AVA_SVG + '<span class="nm2">AVA · ' + m.no + '</span></div>' +
      '<div class="qcard">' +
        '<div class="tagline">' + m.kind + '</div>' +
        '<p class="qtext en">' + m.q + '</p>' +
        '<p class="small" style="margin:9px 0 0">' + m.alt + '</p>' +
      '</div>' +
      '<button class="btn ghost sm" id="speakBtn">🔊 질문 듣기</button>' +
      '<div class="tbox mt12">' +
        '<div class="ringwrap">' +
          '<svg class="ring" viewBox="0 0 100 100">' +
            '<circle class="rbg" cx="50" cy="50" r="44"/>' +
            '<circle class="rfg" id="rfg" cx="50" cy="50" r="44"/>' +
          '</svg>' +
          '<div class="ringtxt"><b id="tsec">60</b><small>SEC</small></div>' +
        '</div>' +
        '<div class="side">' +
          '<p id="tmsg">답변은 40~60초. 6문장이면 충분합니다.</p>' +
          '<div class="btnrow">' +
            '<button class="btn sm" id="tstart">답변 시작</button>' +
            '<button class="btn ghost sm" id="treset">초기화</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<button class="btn line sm" id="modelBtn">💡 모범답안 & 핵심 포인트 3개</button>' +
      '<div id="modelBox"></div>' +
      '<button class="btn accent mt12" id="doneBtn">답변 완료 · +25 XP</button>' +
    '</div>';

  paintRing();
  $('#mockBack').onclick = () => { stopAll(); renderMockIntro(); };
  $('#speakBtn').onclick = () => speakMock(m);
  $('#tstart').onclick = () => toggleAnswerTimer();
  $('#treset').onclick = () => { stopMockTimer(); mock.left = 60; paintRing(); $('#tstart').textContent = '답변 시작'; $('#tmsg').textContent = '답변은 40~60초. 6문장이면 충분합니다.'; };
  $('#modelBtn').onclick = () => toggleModel(m);
  $('#doneBtn').onclick = () => finishMockQ();
  paintHeader();
}

function speakMock(m){
  const text = m.q + (m.alt && m.alt.indexOf('핵심 표현') !== 0 ? ' ' + m.alt : '');
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined'){
    toast('이 기기에서는 음성을 지원하지 않아요. 질문을 읽어 보세요.');
    return;
  }
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(m.q);
    u.lang = 'en-US';
    u.rate = 0.92;
    u.pitch = 1.02;
    u.onstart = () => { const a = $('.ava'); if (a) a.classList.add('talking'); };
    u.onend = () => { const a = $('.ava'); if (a) a.classList.remove('talking'); };
    u.onerror = () => { const a = $('.ava'); if (a) a.classList.remove('talking'); };
    window.speechSynthesis.speak(u);
    if (!S.muted) sfx('tap');
  } catch (e) {
    toast('음성을 재생하지 못했어요. 질문을 읽어 보세요.');
  }
}

function toggleAnswerTimer(){
  if (mock.running){
    stopMockTimer();
    $('#tstart').textContent = '계속';
    return;
  }
  if (mock.left <= 0){ mock.left = 60; paintRing(); }
  mock.running = true;
  sfx('tap');
  $('#tstart').textContent = '일시정지';
  $('#tmsg').textContent = '답변 중… 60초를 넘겨도 괜찮아요, 끝까지 말해 보세요.';
  mock.timer = setInterval(() => {
    mock.left -= 0.2;
    if (mock.left <= 0){
      mock.left = 0;
      paintRing();
      stopMockTimer();
      sfx('win');
      $('#tstart').textContent = '다시';
      $('#tmsg').textContent = '60초 완료! 수고했어요. 완료를 눌러 XP를 받으세요.';
      return;
    }
    paintRing();
  }, 200);
}

function toggleModel(m){
  mock.open = !mock.open;
  const box = $('#modelBox');
  if (!mock.open){ box.innerHTML = ''; $('#modelBtn').textContent = '💡 모범답안 & 핵심 포인트 3개'; return; }
  $('#modelBtn').textContent = '모범답안 닫기';
  box.innerHTML =
    '<div class="model mt12">' +
      '<h4>MODEL ANSWER</h4>' +
      '<p class="en">' + m.en + '</p>' +
      '<p class="ko">' + m.ko + '</p>' +
      '<h4>KEY POINTS</h4>' +
      m.pts.map((p, i) => '<div class="pt"><b>' + (i + 1) + '</b><span>' + p + '</span></div>').join('') +
    '</div>';
  setTimeout(() => { const el = $('.model'); if (el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }, 40);
}

function finishMockQ(){
  stopMockTimer();
  stopSpeech();
  S.mockDone = (S.mockDone || 0) + 1;
  mock.xp += 25;
  save();
  sfx('win');
  gainXP(25);
  toast('+25 XP · 답변 완료');
  if (mock.i + 1 >= mock.list.length){ endMock(); return; }
  mock.i++;
  renderMockQ();
}

function endMock(){
  $('#main').scrollTop = 0;
  $('#main').innerHTML =
    '<div class="screen result">' +
      '<span class="pill yolk">MOCK COMPLETE</span>' +
      '<div class="big">' + mock.list.length + ' <span style="color:#B9B3A6">문항</span></div>' +
      '<p class="small">' + mock.label + ' 세션 완료 · ' + mock.xp + ' XP 획득</p>' +
      '<div class="stat mt12">' +
        '<div><b>' + S.mockDone + '</b><small>누적 완료</small></div>' +
        '<div><b>' + S.grade + '</b><small>현재 등급</small></div>' +
        '<div><b>' + S.xp + '</b><small>누적 XP</small></div>' +
      '</div>' +
      '<div class="card mt12" style="text-align:left">' +
        '<p class="small mb0">다음엔 <b style="color:#14130F">롤플레이 11~13번</b>을 이어서 해 보세요. 11번은 질문 4개, 12번은 요청과 대안, 13번은 12번과 같은 사건을 과거 경험으로 다시 정리하는 것이 핵심입니다.</p>' +
      '</div>' +
      '<button class="btn mt12" id="mockAgain">같은 주제 다시</button>' +
      '<button class="btn ghost mt8" id="mockHome">주제 선택</button>' +
    '</div>';
  $('#mockAgain').onclick = () => startMock(mock.list, mock.label);
  $('#mockHome').onclick = () => renderMockIntro();
  paintHeader();
}

/* =====================================================================
   탭 · 렌더
   ===================================================================== */
let TAB = 'quiz';
function setTab(t){
  TAB = t;
  $$('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  stopAll();
  closeSheet();
  if (t === 'quiz') renderQuizIntro();
  else if (t === 'story') renderStoryList();
  else renderMockIntro();
  $('#main').scrollTop = 0;
}
$$('.tab').forEach(b => b.addEventListener('click', () => {
  audio();
  sfx('tap');
  setTab(b.dataset.tab);
}));

/* 시작 */
paintHeader();
setTab('quiz');
</script>
</body>
</html>
